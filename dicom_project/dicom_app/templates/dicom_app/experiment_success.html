{% extends 'base.html' %}

{% block content %}
<div class="container-fluid p-0" style="background-color: #E6F0FF; min-height: 100vh;">
    <!-- Header Title -->
    <div class="row mb-4 pt-4">
        <div class="col-12 text-center">
            <h1 style="color: #5B7CFA; font-weight: 800; font-size: 2.5rem; letter-spacing: 2px;">DICOM HUB</h1>
        </div>
    </div>

    <!-- Breadcrumb -->
    <div class="row justify-content-center px-4 mb-3">
        <div class="col-12 col-xl-10">
            <nav aria-label="breadcrumb">
                <ol class="breadcrumb breadcrumb-custom">
                    <li class="breadcrumb-item"><a href="{% url 'dashboard' %}" class="breadcrumb-link">Listado de Experimentos</a></li>
                    <li class="breadcrumb-item"><a href="{% url 'experiment_create' %}" class="breadcrumb-link">Nuevo Experimento</a></li>
                    <li class="breadcrumb-item active" aria-current="page">Operación Exitosa</li>
                </ol>
            </nav>
        </div>
    </div>

    <!-- Main Card -->
    <div class="row justify-content-center px-4">
        <div class="col-12 col-xl-10">
            <div class="card border-0 shadow-sm" style="border-radius: 20px; padding: 2rem;">
                <div class="card-body p-0 text-center">
                    <div class="success-header">
                        <h1 class="success-title">¡El experimento se generó exitosamente!</h1>
                        <a href="{% url 'dashboard' %}" class="btn-cancel-outline">Volver al menú principal</a>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<style>
    .content-area {
        background-color: #E6F0FF !important;
        padding: 0 !important;
    }
</style>
{% endblock %}
